version: "3.9"

services:
  backend:
    build: ./backend
    container_name: rentsweep-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - rentsweep-db:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/rentsweep.db
      - SCRAPE_INTERVAL_MINUTES=${SCRAPE_INTERVAL_MINUTES:-60}
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: rentsweep-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  rentsweep-db:
